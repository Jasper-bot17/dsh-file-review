# CI：npm run verify（typecheck + build + bundle 契约 + Host/client 离线自测）
#
# 平台：windows-latest。原因：scripts/test-host.mjs 的用例按本机 Windows 口径写
# （USERPROFILE/TEMP 兜底、C:\Windows\win.ini 绝对路径断言），在 ubuntu 上未必等价；
# 待测试口径可移植后再评估切 ubuntu-latest。
#
# actions 用 v5：运行时为 Node 24，GitHub 托管 runner（>= v2.327.1）已满足。
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile enforced)
        run: npm ci

      - name: Typecheck + build + bundle contract + host/client tests
        run: npm run verify
